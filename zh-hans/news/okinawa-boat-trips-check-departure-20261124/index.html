rder-radius:10px}</style></head><body><main><nav><a href="https://nice.okinawa/zh-hans/news/okinawa-boat-trips-check-departure-20261124/">zh-Hans</a> <a href="https://nice.okinawa/zh-hant/news/okinawa-boat-trips-check-departure-20261124/">zh-Hant</a> <a href="https://nice.okinawa/ja/news/okinawa-boat-trips-check-departure-20261124/">ja</a> <a href="https://nice.okinawa/en/news/okinawa-boat-trips-check-departure-20261124/">en</a></nav><h1>11月24日冲绳出海：去码头前，先确认你订的那一班</h1><p>2026-11-24 · Nice Okinawa</p><p>11月24日早晨，那霸海上保安部公布的预报显示，冲绳南方海上到15时预计出现40节东北风、4米浪。庆良间诸岛和恩纳地区当日上午也有雷电、强风和海浪注意报。</p><p>4米是海区预报，不是你预订的潜点实测值，也不是全岛停航通知。今天订了浮潜、海钓或包船？出发去码头前，请直接向运营方确认：这班是否照常、出发港有无变更、几点在哪里集合。以所订班次的最新通知为准。</p><p><a href="https://www6.kaiho.mlit.go.jp/11kanku/naha/keihou_kaijou.html">海上保安厅官方信息</a> · <a href="https://www6.kaiho.mlit.go.jp/n/11kanku/naha/keihou_chuihou.html">海上保安厅官方信息</a></p><p><a class="cta" href="https://fishing.nice.okinawa/">查看海钓服务</a> <a class="cta" href="https://snorkel.nice.okinawa/">查看浮潜服务</a></p></main></body></html>
