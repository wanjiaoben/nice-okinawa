name: News data service
on:
  pull_request:
    paths: ['news-service/**', '.github/workflows/news-data.yml']
  push:
    tags: ['news-production-*']
permissions:
  contents: read
concurrency:
  group: nice-news-data-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node news-service/test.mjs
      - run: node news-service/render-test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s news-service/review -p 'test_*.py'
  deploy:
    if: startsWith(github.ref, 'refs/tags/news-production-')
    needs: test
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing production rules
        env:
          WAN_RULES_TOKEN: ${{ secrets.WAN_RULES_READ_TOKEN }}
        run: scripts/check_wan_constitution.sh
      - name: Verify annotated tag, approved release identity and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git cat-file tag "$GITHUB_REF_NAME" | grep -Fx 'Wan-Verified: yes'
          git cat-file tag "$GITHUB_REF_NAME" | grep -Fx "Approved-SHA: $(git rev-parse HEAD)"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Publish exact tested modules
        env:
          NICE_NEWS_CLOUDFLARE_API_TOKEN: ${{ secrets.NICE_NEWS_CLOUDFLARE_API_TOKEN }}
          NEWS_DEPLOY_GATE: verified
        run: node news-service/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-release-evidence
          path: news-service/release-evidence/
