ckground:#dbece7;border-radius:10px}</style></head><body><main><nav><a href="https://nice.okinawa/zh-hans/news/tomigusuku-route331-night-closure-20261125/">zh-Hans</a> <a href="https://nice.okinawa/zh-hant/news/tomigusuku-route331-night-closure-20261125/">zh-Hant</a> <a href="https://nice.okinawa/ja/news/tomigusuku-route331-night-closure-20261125/">ja</a> <a href="https://nice.okinawa/en/news/tomigusuku-route331-night-closure-20261125/">en</a></nav><h1>11月25日晚間在豐見城還車？先確認國道331號這段路</h1><p>2026-11-25 · Nice Okinawa</p><p>日本時間11月25日21:00至26日06:00，國道331號田頭至名嘉地一帶因橋梁施工，預計封閉從市道191號交叉口至名嘉地交叉口、往豐見城市役所方向的路段。這是局部單向封路，不是那霸機場關閉。</p><p>若還車或機場接送路線行經此處，請在出發前對照官方交通管制圖，向租車門市或司機確認路線與集合時間。11月26日晚間為施工備用時段，不一定封路。</p><p><a href="https://www.ogb.go.jp/-/media/Files/OGB/Kaiken/kyoten/nangoku/douro_jouhou/kise_261112_331_tomigusukusitagami-nakati_02.pdf">查看南部國道事務所交通管制圖</a></p><footer><a href="https://wa.me/817089523968">WhatsApp · Nice Okinawa</a></footer></main></body></html>
