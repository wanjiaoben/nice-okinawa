lor:#17352d;font:18px/1.8 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:28px 20px}h1{font-size:clamp(26px,5vw,42px);line-height:1.3}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:#146a65;overflow-wrap:anywhere}.cta{display:inline-block;padding:12px 18px;background:#dbece7;border-radius:10px}</style></head><body><main class="news-main"><nav class="lang"><a href="https://nice.okinawa/zh-hans/news/jees-jltct-cbt-first-session-december-2026/">zh-Hans</a> <a href="https://nice.okinawa/zh-hant/news/jees-jltct-cbt-first-session-december-2026/">zh-Hant</a> <a href="https://nice.okinawa/ja/news/jees-jltct-cbt-first-session-december-2026/">ja</a> <a href="https://nice.okinawa/en/news/jees-jltct-cbt-first-session-december-2026/">en</a></nav><h1>12月1日考的是哪一場？先確認考試名稱</h1><p class="date">2026-11-26 · 深耕自留地研究室</p><p class="lead">JEES 於11月20日公布「日本語教育能力検定試験」電腦考試操作影片，首場訂於2026年12月1日。這並非取得日本國家資格「登録日本語教員」的考試。</p><p>依官方工作日規則回推，首場以信用卡預約的期限為11月26日，便利商店及 Pay-easy 則為11月25日，並非全年場次一律於此時截止。請先在 JEES 官網觀看影片，再到預約頁確認考場及剩餘名額。</p><p class="source"><a href="https://www.jees.or.jp/jltct/">https://www.jees.or.jp/jltct/</a></p><footer><a href="https://nice.okinawa/">← 深耕自留地研究室</a></footer></main></body></html>
